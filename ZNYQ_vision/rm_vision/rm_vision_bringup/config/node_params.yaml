/camera_node:
  ros__parameters:
    camera_info_url: package://rm_vision_bringup/config/camera_info.yaml
    exposure_time: 2500
    gain: 8.0

/serial_driver:
  ros__parameters:
    timestamp_offset: 0.006 # 0.006
    device_name: /dev/ttyACM0
    baud_rate: 115200
    flow_control: none
    parity: none
    stop_bits: "1"

/armor_detector:
  ros__parameters:
    debug: true

    detect_color: 0 # 0 红 1 蓝
    binary_thres: 80

    light.min_ratio: 0.1
    armor.min_light_ratio: 0.8

    classifier_threshold: 0.8
    ignore_classes: ["negative"]

/armor_tracker:
  ros__parameters:
    target_frame: odom
    max_armor_distance: 10.0

    ekf:
      sigma2_q_xyz: 0.05
      sigma2_q_yaw: 5.0
      sigma2_q_r: 80.0

      r_xyz_factor: 4e-4
      r_yaw: 5e-3

    tracker:
      max_match_distance: 0.5
      max_match_yaw_diff: 1.0

      tracking_thres: 5
      lost_time_thres: 1.0

/projectile_motion:
  ros__parameters:
    use_sim_time: false
    projectile:
      offset_pitch: 0.0 # 俯仰角的补偿
      offset_yaw: 0.0 # 航向角的补偿
      offset_time: 0.0 # 额外的飞行时间补偿
      initial_speed: 18.0 # 子弹初速度
      target_frame: "gimbal_link" # 目标坐标系
      target_topic: "tracker/target" # 目标话题
      gimbal_cmd_topic: "cmd_gimbal_joint" # 云台控制话题
      shoot_cmd_topic: "cmd_shoot" # 射击控制话题
      solver_type: "gravity" # 弹道模型（只重力/含阻力）: gravity / gaf
      # friction: 0.001                         # Air resistance factor if use GAF solver
