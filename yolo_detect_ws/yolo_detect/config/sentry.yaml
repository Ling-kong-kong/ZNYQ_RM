# 敌方颜色设置: "red" 或 "blue"
enemy_color: "blue"

#####-----神经网络参数-----#####
# 使用的YOLO模型版本
yolo_name: "yolov5"

# 模型文件路径（相对于包根目录）
yolov5_model_path: "models/assets/yolov5.xml"
yolov8_model_path: "models/assets/yolov8.xml"
yolo11_model_path: "models/assets/yolo11.xml"
classify_model: "models/assets/tiny_resnet.onnx"

# 推理设备: "CPU" 或 "GPU"
device: "CPU"

# 检测置信度阈值
min_confidence: 0.8

# 是否使用传统方法进行二次矫正
# use_traditional: true

# 二值化阈值
# threshold: 150

#####-----ROI区域设置-----#####
# 感兴趣区域设置，可提高检测效率
roi:
  x: 420
  y: 50
  width: 600
  height: 600

# 是否启用ROI检测
use_roi: true

#####-----图像参数-----#####
# 图像尺寸
image_width: 1280
image_height: 720
